version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project is pinned to Node 24 (.nvmrc, engines.node), so @types/node stays on
      # the 24.x line. Revisit this rule when the Node pin changes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint's peer range is typescript >=4.8.4 <6.1.0, so TypeScript 7 fails
      # npm ci with ERESOLVE. Revisit once typescript-eslint supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

name: deploy-smoke

on:
  pull_request:
    paths: [Dockerfile, deploy/**, .github/workflows/deploy.yml]
  push:
    branches: [main]
    paths: [Dockerfile, deploy/**, .github/workflows/deploy.yml]

permissions:
  contents: read

jobs:
  smoke-deploy:
    uses: miguelmora76/platform-workflows/.github/workflows/build-deploy.yml@add-smoke-cli
    with:
      service: mcp-devplatform-guardrails
      values-file: deploy/values.yaml
      secret-name: mcp-guardrails-tokens
      secret-key: GUARDRAILS_TOKENS
      secret-prefix: local=mgt_
      smoke-port: '8787'
      smoke-path: /mcp
      smoke-body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
      smoke-headers: |
        Accept: application/json, text/event-stream
      smoke-expect: protocolVersion
      smoke-bearer-secret-key: GUARDRAILS_TOKENS
